<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Urban and Architect Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter'], serif: ['Playfair Display'] }, colors: { dark: '#0A0A0A', accent: '#C9A227' } } } }
    </script>
</head>
<body class="bg-dark text-white font-sans">
    <div id="liveClock" class="fixed top-4 right-4 z-50 text-xs text-gray-400 bg-dark/80 px-3 py-1 rounded border border-white/10"></div>

    <header class="fixed top-0 w-full z-40 bg-dark/95 backdrop-blur border-b border-white/10">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="UAS.jpg" class="h-12" alt="Logo">
                <span class="font-serif hidden sm:block">URBAN AND ARCHITECT SOLUTION</span>
            </a>
            <div class="hidden md:flex space-x-8 text-sm uppercase tracking-widest">
                <a href="index.html" class="hover:text-accent">Home</a>
                <a href="portfolio.html" class="text-accent">Portfolio</a>
                <a href="services.html" class="hover:text-accent">Services</a>
                <a href="calculator.html" class="hover:text-accent">Calculator</a>
                <a href="contact.html" class="hover:text-accent">Contact</a>
            </div>
        </nav>
    </header>

    <main class="pt-32 pb-20 px-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="font-serif text-5xl text-center mb-4">Portfolio of Completed Work</h1>
            <p class="text-center text-gray-400 mb-12">Our architectural projects</p>
            <div class="text-center text-gray-500">
                <p>Project images will appear here once uploaded to the images/ folder.</p>
            </div>
        </div>
    </main>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('liveClock').textContent = now.toLocaleString('en-BD', options);
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
