<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Urban and Architect Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter'] }, colors: { dark: '#0A0A0A', accent: '#C9A227' } } } }
    </script>
</head>
<body class="bg-dark text-white font-sans">
    <div class="min-h-screen flex">
        <aside class="w-64 bg-stone border-r border-white/10 p-6 hidden md:block">
            <div class="flex items-center gap-3 mb-10">
                <img src="logo.png" class="h-8" alt="Logo" onerror="this.style.display='none'">
                <span class="font-semibold text-sm">UAS Admin</span>
            </div>
            <nav class="space-y-2 text-sm">
                <a href="#rates" class="block px-4 py-2 hover:bg-white/5 rounded">Rates & Charges</a>
                <a href="#contact" class="block px-4 py-2 hover:bg-white/5 rounded">Contact Info</a>
                <a href="index.html" class="block px-4 py-2 hover:bg-white/5 rounded text-gray-400">← Back to Site</a>
            </nav>
        </aside>

        <main class="flex-1 p-8">
            <div class="flex justify-between items-center mb-10">
                <h1 class="text-3xl font-semibold">Admin Dashboard</h1>
                <p class="text-sm text-gray-500">Update rates & contact info</p>
            </div>

            <div class="grid md:grid-cols-2 gap-6" id="rates">
                <div class="bg-stone p-6 border border-white/10">
                    <h3 class="text-lg mb-4">Design Rate (per sft)</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center text-sm">
                            <span>Basic</span>
                            <input type="number" id="designBasic" value="40" class="w-24 bg-dark border border-white/20 px-2 py-1 text-right">
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span>Standard</span>
                            <input type="number" id="designStandard" value="55" class="w-24 bg-dark border border-white/20 px-2 py-1 text-right">
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span>Premium</span>
                            <input type="number" id="designPremium" value="75" class="w-24 bg-dark border border-white/20 px-2 py-1 text-right">
                        </div>
                    </div>
                    <button onclick="saveRates()" class="mt-4 w-full bg-accent text-dark py-2 text-sm">Save Design Rates</button>
                </div>

                <div class="bg-stone p-6 border border-white/10">
                    <h3 class="text-lg mb-4">Building Cost Rate (per sft)</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center text-sm">
                            <span>Standard</span>
                            <input type="number" id="buildStandard" value="1800" class="w-28 bg-dark border border-white/20 px-2 py-1 text-right">
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span>Premium</span>
                            <input type="number" id="buildPremium" value="2500" class="w-28 bg-dark border border-white/20 px-2 py-1 text-right">
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span>Luxury</span>
                            <input type="number" id="buildLuxury" value="3500" class="w-28 bg-dark border border-white/20 px-2 py-1 text-right">
                        </div>
                    </div>
                    <button onclick="saveRates()" class="mt-4 w-full bg-accent text-dark py-2 text-sm">Save Building Rates</button>
                </div>
            </div>

            <div class="mt-6 bg-stone p-6 border border-white/10" id="contact">
                <h3 class="text-lg mb-4">Contact Information</h3>
                <div class="grid md:grid-cols-3 gap-4 text-sm">
                    <input type="text" id="phone" value="+880 1352-693918" class="bg-dark border border-white/20 px-3 py-2">
                    <input type="email" id="email" value="uarchsolution@gmail.com" class="bg-dark border border-white/20 px-3 py-2">
                    <input type="text" id="address" value="Coronation School Lane, Katnarpara, Bogura-5800" class="bg-dark border border-white/20 px-3 py-2">
                </div>
                <button onclick="saveContact()" class="mt-4 bg-accent text-dark px-6 py-2 text-sm">Save Contact</button>
            </div>

            <p class="text-xs text-gray-500 mt-8">Changes are saved in your browser. Calculator page will use these rates.</p>
        </main>
    </div>

    <script>
        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('uasSettings') || '{}');
            if (settings.designBasic) document.getElementById('designBasic').value = settings.designBasic;
            if (settings.designStandard) document.getElementById('designStandard').value = settings.designStandard;
            if (settings.designPremium) document.getElementById('designPremium').value = settings.designPremium;
            if (settings.buildStandard) document.getElementById('buildStandard').value = settings.buildStandard;
            if (settings.buildPremium) document.getElementById('buildPremium').value = settings.buildPremium;
            if (settings.buildLuxury) document.getElementById('buildLuxury').value = settings.buildLuxury;
            if (settings.phone) document.getElementById('phone').value = settings.phone;
            if (settings.email) document.getElementById('email').value = settings.email;
            if (settings.address) document.getElementById('address').value = settings.address;
        }

        function saveRates() {
            const settings = JSON.parse(localStorage.getItem('uasSettings') || '{}');
            settings.designBasic = document.getElementById('designBasic').value;
            settings.designStandard = document.getElementById('designStandard').value;
            settings.designPremium = document.getElementById('designPremium').value;
            settings.buildStandard = document.getElementById('buildStandard').value;
            settings.buildPremium = document.getElementById('buildPremium').value;
            settings.buildLuxury = document.getElementById('buildLuxury').value;
            localStorage.setItem('uasSettings', JSON.stringify(settings));
            alert('Rates saved!');
        }

        function saveContact() {
            const settings = JSON.parse(localStorage.getItem('uasSettings') || '{}');
            settings.phone = document.getElementById('phone').value;
            settings.email = document.getElementById('email').value;
            settings.address = document.getElementById('address').value;
            localStorage.setItem('uasSettings', JSON.stringify(settings));
            alert('Contact info saved!');
        }

        loadSettings();
    </script>
</body>
</html>
