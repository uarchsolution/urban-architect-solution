<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Urban and Architect Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter'], serif: ['Playfair Display'] }, colors: { dark: '#0A0A0A', accent: '#C9A227' } } } }
    </script>
</head>
<body class="bg-dark text-white font-sans">
    <header class="fixed top-0 w-full z-50 bg-dark/95 backdrop-blur border-b border-white/10">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="logo.png" class="h-10" alt="Logo">
                <span class="font-serif hidden sm:block">URBAN AND ARCHITECT SOLUTION</span>
            </a>
            <div class="hidden md:flex space-x-8 text-sm uppercase tracking-widest">
                <a href="index.html" class="hover:text-accent">Home</a>
                <a href="portfolio.html" class="text-accent">Portfolio</a>
                <a href="services.html" class="hover:text-accent">Services</a>
                <a href="calculator.html" class="hover:text-accent">Calculator</a>
                <a href="contact.html" class="hover:text-accent">Contact</a>
            </div>
        </nav>
    </header>

    <main class="pt-32 pb-20 px-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="font-serif text-5xl text-center mb-12">Our Projects</h1>

            <div class="flex flex-wrap justify-center gap-3 mb-12 text-sm uppercase tracking-wider">
                <button onclick="filter('all')" class="filter-btn px-5 py-2 border border-accent bg-accent/10">All</button>
                <button onclick="filter('residential')" class="filter-btn px-5 py-2 border border-white/20 hover:border-accent">Residential</button>
                <button onclick="filter('commercial')" class="filter-btn px-5 py-2 border border-white/20 hover:border-accent">Commercial</button>
                <button onclick="filter('master')" class="filter-btn px-5 py-2 border border-white/20 hover:border-accent">Master Planning</button>
                <button onclick="filter('landscape')" class="filter-btn px-5 py-2 border border-white/20 hover:border-accent">Landscape</button>
            </div>

            <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="project residential">
                    <div class="group relative overflow-hidden h-80">
                        <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-end p-6">
                            <div>
                                <p class="text-accent text-xs uppercase">Residential</p>
                                <h3 class="text-xl font-serif">Modern Villa</h3>
                                <a href="project.html" class="text-sm mt-2 inline-block border-b">View Project</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="project commercial">
                    <div class="group relative overflow-hidden h-80">
                        <img src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-end p-6">
                            <div>
                                <p class="text-accent text-xs uppercase">Commercial</p>
                                <h3 class="text-xl font-serif">Office Building</h3>
                                <a href="project.html" class="text-sm mt-2 inline-block border-b">View Project</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="project master">
                    <div class="group relative overflow-hidden h-80">
                        <img src="https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?auto=format&fit=crop&w=800" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition flex items-end p-6">
                            <div>
                                <p class="text-accent text-xs uppercase">Master Planning</p>
                                <h3 class="text-xl font-serif">Township Layout</h3>
                                <a href="project.html" class="text-sm mt-2 inline-block border-b">View Project</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function filter(cat) {
            document.querySelectorAll('.project').forEach(p => {
                p.style.display = (cat === 'all' || p.classList.contains(cat)) ? 'block' : 'none';
            });
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('border-accent', 'bg-accent/10'));
            event.target.classList.add('border-accent', 'bg-accent/10');
        }
    </script>
</body>
</html>
